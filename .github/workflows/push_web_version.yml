name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: deploy-web-player
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      run: npm ci

    - name: Test
      run: npm test

    - name: Build
      env:
        PODCAST_PROXY_URL: ${{ vars.PODCAST_PROXY_URL || 'https://mp3chapters-podcast-proxy.mp3chapters.workers.dev' }}
      run: npm run build-web

    - name: Deploy
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: dist      # The folder the action should deploy.
        branch: gh-pages  # The branch the action should deploy to.

    # GITHUB_TOKEN pushes do not themselves trigger legacy Pages builds.
    - name: Rebuild GitHub Pages
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
