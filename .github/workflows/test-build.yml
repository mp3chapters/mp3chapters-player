name: "test-on-pr"

on: [pull_request, workflow_dispatch]

permissions:
  contents: read

# This workflow will build your tauri app without uploading it anywhere.

jobs:
  test-tauri:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          # Keep Linux dependency downloads consistent with the release workflow.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure.archive.ubuntu.com/d' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libxdo-dev libssl-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: npm ci

      - name: test frontend and proxy
        run: npm test

      - name: check frontend builds
        run: |
          npm run build-app
          npm run build-web

      - name: check Rust formatting and tests
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo test --locked --manifest-path src-tauri/Cargo.toml

      # Without tagName or releaseId this builds without publishing a release.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PODCAST_PROXY_URL: ${{ vars.PODCAST_PROXY_URL }}
