name: "publish"

on:
  push:
    branches:
      - release

# Build signed installers into a draft. Publishing the release later triggers
# update-player-website.yml, once all platforms' assets are available.

jobs:
  check-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to replace an already published release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const { version } = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            const tag = `app-v${version}`;
            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
              if (!release.draft) {
                core.setFailed(`${tag} is already published. Bump the app version before building a new release.`);
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }

  publish-tauri:
    needs: check-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Prepare Apple signing and notarization
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY KEYCHAIN_PASSWORD APPLE_API_ISSUER APPLE_API_KEY APPLE_API_PRIVATE_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done
          if [[ "$APPLE_SIGNING_IDENTITY" != "Developer ID Application:"* ]]; then
            echo "::error::APPLE_SIGNING_IDENTITY must be a Developer ID Application identity for distribution outside the App Store."
            exit 1
          fi
          umask 077
          certificate_path="$RUNNER_TEMP/apple-signing.p12"
          keychain_path="$RUNNER_TEMP/apple-signing.keychain-db"
          api_key_path="$RUNNER_TEMP/apple-notarization.p8"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$api_key_path"
          openssl pkey -in "$api_key_path" -passin pass: -noout
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" "$HOME/Library/Keychains/login.keychain-db"
          if ! security find-identity -v -p codesigning "$keychain_path" | grep -F -- "\"$APPLE_SIGNING_IDENTITY\"" > /dev/null; then
            echo "::error::The imported certificate does not contain the configured valid signing identity."
            exit 1
          fi
          printf 'APPLE_API_KEY_PATH=%s\n' "$api_key_path" >> "$GITHUB_ENV"
          rm -f "$certificate_path"

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          # Azure's mirror repeatedly stalled downloads on the release runners.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure.archive.ubuntu.com/d' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libxdo-dev libssl-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: npm ci

      - name: test frontend and proxy
        run: npm test

      - name: Build and upload installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PODCAST_PROXY_URL: ${{ vars.PODCAST_PROXY_URL }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
        with:
          args: --target ${{ matrix.target }}
          tagName: app-v__VERSION__ # the action automatically replaces \_\_VERSION\_\_ with the app version
          releaseName: "App v__VERSION__"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false

      - name: Verify macOS signature and notarization
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          MACOS_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          app_path="src-tauri/target/$MACOS_TARGET/release/bundle/macos/MP3 Chapter Player.app"
          codesign --verify --deep --strict "$app_path"
          codesign --display --verbose=4 "$app_path" 2>&1 | grep -F -- "Authority=$APPLE_SIGNING_IDENTITY" > /dev/null
          xcrun stapler validate "$app_path"
          spctl --assess --type execute --verbose "$app_path"

      - name: Remove Apple signing material
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/apple-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/apple-signing.p12" "$RUNNER_TEMP/apple-notarization.p8"
